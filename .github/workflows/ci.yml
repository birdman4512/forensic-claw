name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (wrappers + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'
          additional_files: 'workspace/tools/run-forensic-tool.sh workspace/tools/run-plaso-tool.sh workspace/tools/run-vol2-tool.sh workspace/tools/new-case.sh scripts/check-references.sh'

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create stub .env so compose interpolation succeeds
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet

  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq-parse every tracked .json
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "INVALID JSON: $f"
              fail=1
            fi
          done < <(git ls-files '*.json')
          exit "$fail"

  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontmatter on every forensic-tool skill
        run: |
          set -euo pipefail
          fail=0
          for f in skills/forensic-tool-*/SKILL.md; do
            # Frontmatter must start at line 1, end with --- on a later line,
            # and contain both `name:` and `description:` keys.
            head -n 20 "$f" > /tmp/fm
            if ! head -n 1 /tmp/fm | grep -q '^---$'; then
              echo "FAIL [no opening ---]: $f"; fail=1; continue
            fi
            if ! tail -n +2 /tmp/fm | grep -q '^---$'; then
              echo "FAIL [no closing ---]: $f"; fail=1; continue
            fi
            if ! grep -q '^name:' /tmp/fm; then
              echo "FAIL [missing name:]: $f"; fail=1
            fi
            if ! grep -q '^description:' /tmp/fm; then
              echo "FAIL [missing description:]: $f"; fail=1
            fi
          done
          exit "$fail"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker build (Dockerfile + tool image)
    runs-on: ubuntu-latest
    needs:
      - shellcheck
      - hadolint
      - validate-compose
      - validate-json
      - validate-skills
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create stub .env so compose interpolation succeeds
        run: cp .env.example .env
      - name: Build the custom image
        run: docker compose build openclaw-gateway
