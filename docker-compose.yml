# =============================================================================
# OpenClaw – Docker Compose
# =============================================================================
# Quick start:
#   cp .env.example .env        # fill in your secrets
#   docker compose build        # build the custom image (installs extra tools)
#   docker compose run --rm openclaw-cli onboard
#   docker compose up -d openclaw-gateway
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # init-perms – one-shot helper that fixes ownership of the bind-mounted
  # directories so the `node` user (uid 1000) inside the gateway can chmod
  # them. Docker Desktop bind-mounts come in as root-owned, which breaks
  # OpenClaw's exec sandbox (it tries to chmod /home/node/.openclaw on every
  # exec and fails with EPERM).
  # ---------------------------------------------------------------------------
  init-perms:
    image: alpine:3.20
    user: root
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./config}:/mnt/config
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/mnt/workspace
      - ${OPENCLAW_SKILLS_DIR:-./skills}:/mnt/skills
      - ${OPENCLAW_CASES_DIR:-./cases}:/mnt/cases
      - ${OPENCLAW_LOGS_DIR:-./logs}:/mnt/logs
    entrypoint: ["sh", "-c"]
    command:
      - 'chown 1000:1000 /mnt/config /mnt/workspace /mnt/skills /mnt/cases /mnt/logs'
    restart: "no"

  # ---------------------------------------------------------------------------
  # Gateway – the main OpenClaw process
  # ---------------------------------------------------------------------------
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # Always re-fetch the OPENCLAW_IMAGE base on build so `:latest` actually
      # tracks upstream instead of reusing a stale cached FROM layer.
      pull: true
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/phioranex/openclaw-docker:latest}
    image: openclaw-custom:latest          # tag the built image locally
    env_file: .env
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-Australia/Brisbane}

      # Gateway auth
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-}

      # AI provider secrets (passed from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Claude web session (optional)
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-openclaw}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      OPENCLAW_OTEL_PRELOADED: ${OPENCLAW_OTEL_PRELOADED:-}

      # Forensic Claw tool wrappers (run-forensic-tool.sh and friends) write
      # an auto-log line per invocation into FORENSIC_CLAW_LOG_DIR.
      FORENSIC_CLAW_LOG_DIR: /home/node/.openclaw/logs
      FORENSIC_CLAW_CASE_ROOT: /home/node/.openclaw/cases

      # Host paths used by the docker-in-docker wrappers (plaso/vol2/memprocfs/
      # nuclei). These MUST be host-side absolute paths because the docker
      # daemon resolves bind-mounts against the host filesystem, not against
      # the gateway container. Set OPENCLAW_CASES_HOST_PATH in .env.
      FORENSIC_CLAW_CASES_HOST_DIR: ${OPENCLAW_CASES_HOST_PATH:-}

      # Upstream tool images consumed by the wrappers (overridable per-host).
      FORENSIC_CLAW_PLASO_IMAGE: ${FORENSIC_CLAW_PLASO_IMAGE:-log2timeline/plaso:latest}
      FORENSIC_CLAW_VOL2_IMAGE: ${FORENSIC_CLAW_VOL2_IMAGE:-blacktop/volatility:2.6}
      FORENSIC_CLAW_MEMPROCFS_IMAGE: ${FORENSIC_CLAW_MEMPROCFS_IMAGE:-forensic-claw-memprocfs:latest}
      FORENSIC_CLAW_NUCLEI_IMAGE: ${FORENSIC_CLAW_NUCLEI_IMAGE:-projectdiscovery/nuclei:latest}

    volumes:
      # Core OpenClaw config & session data
      - ${OPENCLAW_CONFIG_DIR:-./config}:/home/node/.openclaw

      # Workspace – files the agent reads/writes; supports sub-agents sharing state
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/.openclaw/workspace

      # Skills – custom skills loaded by the agent
      - ${OPENCLAW_SKILLS_DIR:-./skills}:/home/node/.openclaw/skills

      # Cases – task/case files handed to the agent
      - ${OPENCLAW_CASES_DIR:-./cases}:/home/node/.openclaw/cases

      # Forensic Claw tool-command history log (auto-written by run-forensic-tool.sh)
      - ${OPENCLAW_LOGS_DIR:-./logs}:/home/node/.openclaw/logs

      # Docker socket for the in-image wrappers that shell out to upstream
      # tool images (plaso, vol2, memprocfs, nuclei). Required for those four
      # wrappers; the rest of the toolchain runs in-process and ignores it.
      - /var/run/docker.sock:/var/run/docker.sock

    # Adds the node user to the docker group so it can read the socket above.
    group_add:
      - "${DOCKER_GID:-999}"

    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"   # Web UI / API
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"    # Internal bridge

    init: true
    restart: unless-stopped

    depends_on:
      init-perms:
        condition: service_completed_successfully

    # Image ENTRYPOINT is already `node /app/dist/index.js`; just pass subcommand args.
    command:
      [
        "gateway",
        "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port", "18789",
        "--allow-unconfigured",
      ]

    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # CLI – one-shot helper for onboarding, dashboard tokens, device approval, etc.
  # Usage: docker compose run --rm openclaw-cli <command>
  #   e.g. docker compose run --rm openclaw-cli onboard
  #        docker compose run --rm openclaw-cli dashboard --no-open
  #        docker compose run --rm openclaw-cli devices list
  # ---------------------------------------------------------------------------
  openclaw-cli:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/phioranex/openclaw-docker:latest}
    image: openclaw-custom:latest          # reuses the same built image
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo                        # prevents headless browser pop-ups
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${OPENCLAW_TZ:-Australia/Brisbane}

      FORENSIC_CLAW_LOG_DIR: /home/node/.openclaw/logs
      FORENSIC_CLAW_CASE_ROOT: /home/node/.openclaw/cases
      FORENSIC_CLAW_CASES_HOST_DIR: ${OPENCLAW_CASES_HOST_PATH:-}
      FORENSIC_CLAW_PLASO_IMAGE: ${FORENSIC_CLAW_PLASO_IMAGE:-log2timeline/plaso:latest}
      FORENSIC_CLAW_VOL2_IMAGE: ${FORENSIC_CLAW_VOL2_IMAGE:-blacktop/volatility:2.6}
      FORENSIC_CLAW_MEMPROCFS_IMAGE: ${FORENSIC_CLAW_MEMPROCFS_IMAGE:-forensic-claw-memprocfs:latest}
      FORENSIC_CLAW_NUCLEI_IMAGE: ${FORENSIC_CLAW_NUCLEI_IMAGE:-projectdiscovery/nuclei:latest}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_SKILLS_DIR:-./skills}:/home/node/.openclaw/skills
      - ${OPENCLAW_CASES_DIR:-./cases}:/home/node/.openclaw/cases
      - ${OPENCLAW_LOGS_DIR:-./logs}:/home/node/.openclaw/logs
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    stdin_open: true
    tty: true
    init: true
    # Image ENTRYPOINT is `node /app/dist/index.js`; user passes the subcommand
    # via `docker compose run --rm openclaw-cli <subcommand>`.
    depends_on:
      - openclaw-gateway
